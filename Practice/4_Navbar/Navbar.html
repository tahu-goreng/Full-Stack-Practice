<!DOCTYPE HTML>
<html>
    <head>
        <style>
            body {
                background-color: #242424;
                font-family: Arial, Helvetica, sans-serif;
                margin: 0px;
                padding: 20px;

            }
            .navbar{
                /* background-color: #fff; */
                margin-bottom: 40px;
            }

            h2{
                color: #fff;
                margin-bottom: 10px;
                /* font-size: 25px; */
            }

            ul{
                list-style-type: none;
            }

            a {
                text-decoration: none;
            }

            .nav1{
                background-color: #eaeaea;
                padding: 10px;
            }

            .nav1 ul{
                display: flex;
                justify-content:space-around;
                align-items: center;
                margin: 0px;
                padding: 0px;
            }

            .nav1 li{
                display: inline;
            }

            .nav1 a{
                color: #202020;
                text-decoration: none;
                position: relative;
                padding: 5px 15px;
            }

            .nav1 a::after{
                content: "";
                background-color: black;
                display: block;
                width: 100%;
                height: 2px;
                position:absolute;
                bottom: 0px;
                transform: scaleX(0);   
                transition: transform 0.3s ease-in-out;
            }

            .nav1 a:hover::after{
                transform: scaleX(1);
            }

            .nav1 button{
                background-color: blue;
                border-width: 0px;
                border-radius:10%;
                color: white;
                padding: 5px 10px;
            }

            .nav2{
                background-color: #03643c;
                padding: 20px;
                width: 200px;
            }

            .nav2 ul{
                margin: 0px;
                padding: 0px;
            }

            .nav2 li{
                margin-bottom: 12px;
            }

            .nav2 a{
                color: white;   
                width: 100%;
                display: block;
                padding: 10px;
            }

            .nav2 a:hover{
                background-color: limegreen;
            }

            .nav2 button{
                border: none;
                width: 100%;
                padding: 10px;
                color: white;
                background-color: lightgreen;
            }

            .nav3{
                background-color: skyblue;
                padding: 10px;
            }

            .nav3 ul{
                display: flex;
                justify-content: space-around;
                padding: 0px;
                margin: 0px;
                align-items: center;
            }
            .nav3 a{
                color: white;
                padding: 10px;
                display: block;
            }
            .nav3 .dropdown-content{
                display: none;
            }

            .nav3 .dropdown:hover .dropdown-content{
                display: block;
                position: absolute;
                background-color: grey;
                min-width: 150px;
            }
        </style>
    </head>
    <body>
        <div class="navbar">
            <h2>Variation 1: Horizontal with underline effect</h2>
            <div class="nav1">
                <ul>
                    <li><a href="#">Home</a></li>
                    <li><a href="#">About</a></li>
                    <li><a href="#">Products</a></li>
                    <button type="button">Login</button>
                </ul>
            </div>
        </div>
        <div class="navbar">
            <h2>Variation 2: Vertical with hover effect</h2>
            <div class="nav2">
                <ul>
                    <li><a href="#">Home</a></li>
                    <li><a href="#">About</a></li>
                    <li><a href="#">Products</a></li>
                    <button type="button">Login</button>
                </ul>
            </div>
        </div>
        <div class="navbar">
            <h2>Variation 3: Horizontal with dropdown</h2>
            <div class="nav3">
                <ul>
                    <li><a href="#">Home</a></li>
                    <li class="dropdown">
                        <a href="#">About</a>
                        <ul class="dropdown-content">
                            <li><a href="#">Our story</a></li>
                            <li><a href="#">Team</a></li>
                            <li><a href="#">Contact</a></li>
                        </ul>
                    </li>
                    <li><a href="#">Products</a></li>
                    <li><button type="button">Login</button></li>
                </ul>
            </div>
        </div>
    </body>
</html>
